region: eu-north-1
# Bedrock model or inference-profile IDs enabled in the account (eu-north-1, Stockholm).
models:
  writer: eu.anthropic.claude-sonnet-5-5
  planner: eu.anthropic.claude-haiku-5-5
  checker: eu.anthropic.claude-haiku-5-5
limits:
  max_tool_calls: 12
  max_input_tokens: 150000
  max_output_tokens: 8000
  max_seconds: 90
daily:
  per_ip_runs_per_day: 3
  global_runs_per_day: 30
site_base_url: https://martin-valny.github.io/trials/data/
allowed_origin: https://martin-valny.github.io
tables:
  runs: diligence-runs
  limits: diligence-limits
  flags: diligence-flags
agent_version: "0.1.0"
# Per model ID, USD per million tokens. Anthropic list prices (Haiku 5.5 below 100k-token
# prompts; Sonnet 5.5 cache read before the Oct 2026 cut), so recorded costs err high. Check the
# Bedrock console for the EU-profile prices. prompt_cache: false for models that reject cache points.
prices:
  eu.anthropic.claude-sonnet-5-5:
    {input_per_mtok: 2.00, output_per_mtok: 10.00, cache_read_per_mtok: 0.20, cache_write_per_mtok: 2.50}
  eu.anthropic.claude-haiku-5-5:
    {input_per_mtok: 0.10, output_per_mtok: 0.50, cache_read_per_mtok: 0.01, cache_write_per_mtok: 0.125}
