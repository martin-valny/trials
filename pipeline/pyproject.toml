[project]
name = "trialradar"
version = "0.1.0"
description = "Daily ClinicalTrials.gov change tracker"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "httpx",
    "pydantic",
    "pyyaml",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
trialradar = "trialradar.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pip-audit",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real ClinicalTrials.gov API",
    "recorded: tests that need fixtures recorded by scripts/record_fixtures.py",
    "recorded_fresh: checks only valid on fixtures recorded with the relevance filter",
]
addopts = "-m 'not live and not recorded_fresh'"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "umap.*"]
ignore_missing_imports = true
