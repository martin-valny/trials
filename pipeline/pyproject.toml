[project]
name = "trialradar"
version = "0.1.0"
description = "Daily ClinicalTrials.gov change tracker"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "httpx",
    "pydantic",
    "pyyaml",
]

[project.scripts]
trialradar = "trialradar.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pip-audit",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that hit the real ClinicalTrials.gov API"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
